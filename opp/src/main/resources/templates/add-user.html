<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salvare Utilizator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h3 th:text="${user.id == null} ? 'Adaugă Utilizator Nou' : 'Editează Utilizator'"></h3>
    </div>
    <div class="card-body">
        <form th:action="@{/users/save}" th:object="${user}" method="POST">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label">Nume Utilizator (Username):</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="ex: george_fit" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="ex: contact@fitness.com" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Parolă:</label>
                <input type="password" th:field="*{password}" class="form-control"
                       th:required="${user.id == null}"
                       placeholder="Introduceți parola" />
                <small class="text-muted" th:if="${user.id != null}">Lăsați gol dacă nu doriți să schimbați parola.</small>
            </div>

            <div class="mb-3">
                <label class="form-label">Rol Sistem:</label>
                <select th:field="*{role}" class="form-select">
                    <option value="ROLE_USER">Utilizator (User)</option>
                    <option value="ROLE_ADMIN">Administrator</option>
                    <option value="ROLE_COACH">Antrenor (Coach)</option>
                </select>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success px-4">Salvează</button>
                <a th:href="@{/users/list}" class="btn btn-secondary px-4">Înapoi la listă</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
