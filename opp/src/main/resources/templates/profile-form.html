<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestiune Profil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
<div class="container bg-white p-4 shadow rounded" style="max-width: 500px;">
  <h3 th:text="${isUpdate} ? 'Editare Profil' : 'Adaugare Profil'"></h3>

  <form th:action="@{/profile/save}" th:object="${userProfile}" method="POST">
    <input type="hidden" th:field="*{id}" />

    <input type="hidden" th:if="${isUpdate}" th:field="*{user.id}" />

    <div class="mb-3" th:if="${!isUpdate}">
      <label class="form-label">Utilizator</label>
      <select th:field="*{user.id}" class="form-select" required>
        <option value="">-- Alege Utilizator --</option>
        <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Varsta</label>
      <input type="number" th:field="*{age}" class="form-control" required min="14"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Greutate (kg)</label>
      <input type="number" step="0.1" th:field="*{weight}" class="form-control" required/>
    </div>

    <div class="mb-3">
      <label class="form-label">Obiectiv Fitness</label>
      <select th:field="*{fitnessGoal}" class="form-select">
        <option value="Slabire">Slabire</option>
        <option value="Masa Musculara">Masa Musculara</option>
        <option value="Mentinere">Mentinere</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Salveaza Profil</button>
    <a th:href="@{/profile/list}" class="btn btn-link w-100 mt-2">Inapoi la lista</a>
  </form>
</div>
</body>
</html>
