<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestiune Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 shadow">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-dumbbell text-info"></i> Fitness Admin</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/users/list}">Utilizatori</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/profile/list}">Editare Profil</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/coaches/list}">Antrenori</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/workout-groups/list}">Workouts</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/exercises/list}">Exercitii</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/nutrition/list}">Nutritie</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container bg-white p-4 shadow-sm rounded">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="fas fa-id-card text-primary"></i> Date Fizice Membri</h3>
        <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/profile/showFormForAdd}" class="btn btn-success"><i class="fas fa-plus"></i> Adauga Profil</a>
    </div>

    <table class="table table-hover border text-center">
        <thead class="table-dark">
        <tr>
            <th>User</th>
            <th>Varsta</th>
            <th>Greutate (kg)</th>
            <th>Obiectiv</th>
            <th sec:authorize="hasAuthority('ADMIN')">Actiuni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${profiles}">
            <td th:text="${p.user != null ? p.user.username : 'N/A'}" class="fw-bold align-middle"></td>
            <td th:text="${p.age}" class="align-middle"></td>
            <td th:text="${p.weight}" class="align-middle text-success"></td>
            <td th:text="${p.fitnessGoal}" class="align-middle small"></td>
            <td class="align-middle" sec:authorize="hasAuthority('ADMIN')">
                <a th:href="@{/profile/showFormForUpdate(profileId=${p.id})}" class="btn btn-sm btn-outline-primary"><i class="fas fa-edit"></i></a>
                <a th:href="@{/profile/delete(profileId=${p.id})}"
                   class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Stergi datele fizice?')">
                    <i class="fas fa-trash"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
