<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Salvare Exercițiu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light mt-5">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 rounded">
        <div class="card-header bg-dark text-white text-center py-3">
          <h4 class="mb-0">
            <i class="fas fa-dumbbell me-2 text-info"></i>
            <span th:text="${exercise.id == null} ? 'Adaugă Exercițiu Nou' : 'Editează Exercițiu'"></span>
          </h4>
        </div>
        <div class="card-body p-4 bg-white">
          <form th:action="@{/exercises/save}" th:object="${exercise}" method="POST">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label class="form-label fw-bold">Nume Exercițiu:</label>
              <input type="text" th:field="*{name}" class="form-control" placeholder="ex: Flotări, Genoflexiuni" required />
              <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Grupă Musculară:</label>
                <input type="text" th:field="*{muscleGroup}" class="form-control" placeholder="ex: Piept, Picioare" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">Durată (secunde):</label>
                <input type="number" th:field="*{duration}" class="form-control" placeholder="0" />
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Seturi:</label>
                <input type="number" th:field="*{sets}" class="form-control" placeholder="ex: 3" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">Repetări:</label>
                <input type="number" th:field="*{reps}" class="form-control" placeholder="ex: 12" />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Descriere / Instrucțiuni:</label>
              <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Cum se execută corect..."></textarea>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i> Salvează Exercițiul
              </button>
              <a th:href="@{/exercises/list}" class="btn btn-outline-secondary">
                <i class="fas fa-times me-1"></i> Anulează
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
