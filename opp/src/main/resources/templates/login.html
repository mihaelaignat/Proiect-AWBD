<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - Fitness Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .login-container { margin-top: 100px; max-width: 400px; }
    .card { border: none; border-radius: 15px; }
    .btn-primary { background-color: #212529; border: none; }
    .btn-primary:hover { background-color: #343a40; }
  </style>
</head>
<body>
<div class="container login-container">
  <div class="card shadow">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="fas fa-dumbbell fa-3x text-info"></i>
        <h3 class="mt-3 fw-bold">Fitness Admin</h3>
        <p class="text-muted">Introduceți datele de acces</p>
      </div>

      <div th:if="${param.error}" class="alert alert-danger p-2 text-center" style="font-size: 0.9rem;">
        Username sau parolă incorectă!
      </div>

      <div th:if="${param.logout}" class="alert alert-success p-2 text-center" style="font-size: 0.9rem;">
        Te-ai delogat cu succes!
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Utilizator" required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Parolă</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="******" required>
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" name="remember-me" class="form-check-input" id="remember">
          <label class="form-check-label" for="remember">Ține-mă minte</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Autentificare</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
