<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salvare Plan Nutritional</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="fas fa-apple-whole"></i> Detalii Plan Nutritional</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/nutrition/save}" th:object="${plan}" method="POST">
                        
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Nume Plan</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Ex: Low Carb, Bulk..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Calorii</label>
                            <input type="number" th:field="*{calories}" class="form-control" placeholder="Ex: 2500" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descriere / Observatii</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Salveaza Planul
                            </button>
                            <a th:href="@{/nutrition/list}" class="btn btn-outline-secondary">Anuleaza</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
